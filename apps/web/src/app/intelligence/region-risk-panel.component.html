<section class="risk-section" aria-labelledby="risk-title">
  <header class="section-heading">
    <div><p class="eyebrow">Prioridade territorial</p><h2 id="risk-title">Regiões que merecem atenção</h2><p>Índice de priorização por região · escala de 0 a 100 · não é probabilidade.</p></div>
    <span>{{ regions().length }} regiões</span>
  </header>
  <div class="region-ranking" aria-label="Comparação dos índices de priorização regionais">
    @for (region of regions(); track region.regionId) {
      <button type="button" class="region-row" [class.region-row--selected]="selectedRegionId() === region.regionId" (click)="regionSelected.emit(region)" [attr.aria-pressed]="selectedRegionId() === region.regionId" [attr.aria-label]="region.regionName + ': ' + (region.riskScore === null ? 'dados insuficientes' : 'índice ' + region.riskScore + ' de 100') + ', classificação ' + riskLabel(region.classification)">
        <span class="region-row__content">
          <span class="region-row__name"><strong>{{ region.regionName }}</strong><small>{{ region.zone }} · {{ region.eligibleEquipmentCount }} equipamentos elegíveis</small></span>
          @if (region.riskScore !== null) {
            <span class="risk-track" role="meter" [attr.aria-label]="'Índice de priorização de ' + region.regionName" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="region.riskScore"><span [class]="'risk-track__fill risk-track__fill--' + region.classification" [style.width]="scoreWidth(region.riskScore)"></span></span>
          } @else { <span class="risk-track risk-track--empty"><span></span></span> }
        </span>
        <span class="region-row__score"><strong>{{ region.riskScore === null ? '—' : region.riskScore }}</strong><small>{{ riskLabel(region.classification) }}</small></span>
      </button>
    } @empty { <p class="empty-copy">Nenhuma região cadastrada para esta origem.</p> }
  </div>
</section>
